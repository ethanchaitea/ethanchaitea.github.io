<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Ethan Chai • Contact</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preconnect" href="https://rsms.me/">
        <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
        <link rel="stylesheet" href="styles.css">
        <script src="https://kit.fontawesome.com/6761bcdb8c.js" crossorigin="anonymous" defer></script>
    </head>
    <body>
        <header class="header">
            <a href="/" class="header-logo">ethanchai<strong class="header-logo-strong">.dev</strong></a>
            <nav class="header-navigation">
                <ul>
                    <li><a href="/me" class="underline">Me</a></li>
                    <li><a href="/catalog" class="underline">Catalog</a></li>
                    <li><a href="/contact" class="underline">Contact</a></li>
                </ul>
            </nav>
        </header>
        <main>

            <section class="contact">
                <h1 class="title">Contact</h1>
                <p class="text">
                    If you have an interesting idea or a vacant role you think I'd fit, let's talk!
                </p>
                <div class="contact">
                    <div class="contact-title">Name</div>
                    <input type="text" placeholder="Enter your name" required class="contact-info">
                    <div class="contact-title">Email</div>
                    <input type="email" placeholder="Enter your email" required class="contact-info">
                    <div class="contact-title">Message</div>
                    <textarea placeholder="Enter your message" required class="contact-info contact-message"></textarea>
                    <a class="click" id="contact-send">Send!</a>
                </div>
            </section>

        </main>
        <footer class="footer">
            <nav class="footer-navigation">
                <ul>
                    <li><a href="https://github.com/ethanchaitea" class="footer-link" target="_blank" rel="noreferrer"><i class="fa-brands fa-github-alt"></i></a></li>
                    <li><a href="https://linkedin.com/in/ethan-chai" class="footer-link" target="_blank" rel="noreferrer"><i class="fa-brands fa-linkedin"></i></a></li>
                    <li><a href="https://instagram.com/ethan.chai.tea" class="footer-link" target="_blank" rel="noreferrer"><i class="fa-brands fa-instagram"></i></a></li>
                </ul>
            </nav>
            <p class="footer-cc">© 2026 Ethan Chai</p>
        </footer>
    </body>
</html>
